[project]
name = "med-advisor-rl"
version = "0.1.0"
description = "Med Advisor conversation environment for Prime-RL"
requires-python = "~=3.12.0"
dependencies = [
    "verifiers",
    "pydantic>=2.12.3",
    "openai>=2.54.0,<3.0.0",
    "renderers>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/med_advisor_rl"]